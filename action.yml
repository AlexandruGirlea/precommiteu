name: precommitEU compliance scan
description: Scan changed code for EU regulatory compliance with local models on a self-hosted runner.
author: Alexandru Girlea

branding:
  icon: shield
  color: blue

inputs:
  regulations:
    description: Comma-separated regulation packs to scan against.
    default: gdpr
  paths:
    description: Paths to scan. Empty scans PR changes or the changes in a push.
    default: ""
  fail-on-findings:
    description: Fail the job when confirmed findings remain.
    default: "true"
  sarif:
    description: Path to write the SARIF report to.
    default: precommiteu.sarif
  summary:
    description: Path to write the Markdown summary to.
    default: precommiteu-summary.md

outputs:
  sarif:
    description: Path to the SARIF report.
    value: ${{ inputs.sarif }}
  summary:
    description: Path to the Markdown summary.
    value: ${{ inputs.summary }}

runs:
  using: composite
  steps:
    - name: Resolve diff history
      id: diff
      if: inputs.paths == ''
      shell: bash
      env:
        TARGET: ${{ github.base_ref || github.event.repository.default_branch || 'main' }}
        EVENT_NAME: ${{ github.event_name }}
        BEFORE: ${{ github.event.before }}
      run: |
        if [ "$EVENT_NAME" = "push" ]; then
          if [ -z "$BEFORE" ]; then
            echo "::error::Push event is missing its before commit."
            exit 2
          elif [[ "$BEFORE" =~ ^0+$ ]]; then
            BEFORE=$(git hash-object -w -t tree --stdin </dev/null)
          else
            git cat-file -e "${BEFORE}^{commit}" 2>/dev/null || git fetch --quiet origin "$BEFORE"
          fi
          echo "base=$BEFORE" >> "$GITHUB_OUTPUT"
        else
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --unshallow --quiet
          fi
          git fetch --quiet origin "+refs/heads/${TARGET}:refs/remotes/origin/${TARGET}"
        fi

    - name: Scan
      shell: bash
      env:
        GIT_MERGE_TARGET_BRANCH: origin/${{ github.base_ref || github.event.repository.default_branch || 'main' }}
        GIT_DIFF_BASE: ${{ steps.diff.outputs.base }}
        REGULATIONS: ${{ inputs.regulations }}
        PATHS: ${{ inputs.paths }}
        SARIF: ${{ inputs.sarif }}
        SUMMARY: ${{ inputs.summary }}
        FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
      run: |
        if ! command -v precommiteu >/dev/null; then
          echo "::error::precommiteu not found. Run this job in the precommitEU container: https://alexandrugirlea.github.io/precommiteu/ci.html"
          exit 2
        fi
        # --force: the action owns these paths and rewrites them each run.
        args=(--regulations "$REGULATIONS" --sarif "$SARIF" --out "$SUMMARY" --force --fail-on-error)
        if [ "$FAIL_ON_FINDINGS" = "true" ]; then
          args+=(--fail-on-findings)
        fi
        if [ -n "$PATHS" ]; then
          # shellcheck disable=SC2086
          precommiteu scan $PATHS "${args[@]}"
        else
          precommiteu scan --ci "${args[@]}"
        fi
